name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package IPA
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: |
          xcodegen generate
          sed -i '' 's/objectVersion = [0-9]*/objectVersion = 56/g' ErmayMobil.xcodeproj/project.pbxproj || true

      - name: Resolve Swift Package Dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project ErmayMobil.xcodeproj -scheme ErmayMobil

      - name: Archive iOS App
        run: |
          xcodebuild -project ErmayMobil.xcodeproj \
            -scheme ErmayMobil \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ErmayMobil.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload into IPA
        run: |
          mkdir -p build/Payload
          cp -r build/ErmayMobil.xcarchive/Products/Applications/ErmayMobil.app build/Payload/
          # Copy app icons directly into .app bundle root for guaranteed Springboard icon display
          cp Sources/ErmayMobil/Resources/Assets.xcassets/AppIcon.appiconset/*.png build/Payload/ErmayMobil.app/ || true
          cd build
          zip -qr ErmayMobil.ipa Payload
          ls -lh ErmayMobil.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ErmayMobil-iOS-IPA
          path: build/ErmayMobil.ipa
          retention-days: 14

      - name: Create GitHub Release with IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Ermay Mobil iOS v1.0.${{ github.run_number }}
          files: build/ErmayMobil.ipa
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

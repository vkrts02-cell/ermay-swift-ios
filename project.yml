name: ErmayMobil
options:
  bundleIdPrefix: com.ermay
  deploymentTarget:
    iOS: "16.0"
  compatibilityVersion: "Xcode 15.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
targets:
  ErmayMobil:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/ErmayMobil
        excludes:
          - "**/.gitkeep"
    dependencies:
      - package: KeychainAccess
        product: KeychainAccess
    settings:
      base:
        PRODUCT_NAME: "ErmayMobil"
        PRODUCT_BUNDLE_IDENTIFIER: com.ermay.muhasebe
        INFOPLIST_FILE: Sources/ErmayMobil/Info.plist
        CURRENT_PROJECT_VERSION: "3"
        MARKETING_VERSION: "1.0.2"
        ENABLE_BITCODE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
packages:
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess.git
    from: 4.2.2

name: ErmayMobil
options:
  bundleIdPrefix: com.ermay
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEVELOPMENT_TEAM: ""
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    OTHER_SWIFT_FLAGS: "-enable-experimental-feature AccessLevelOnImport"
targets:
  ErmayMobil:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/ErmayMobil
        excludes:
          - "**/.gitkeep"
    dependencies:
      - package: Supabase
        product: Supabase
      - package: KeychainAccess
        product: KeychainAccess
      - package: Lottie
        product: Lottie
      - package: SQLite
        product: SQLite
    settings:
      base:
        PRODUCT_NAME: "ErmayMobil"
        PRODUCT_BUNDLE_IDENTIFIER: com.ermay.muhasebe
        INFOPLIST_FILE: Sources/ErmayMobil/Info.plist
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0.0"
        ENABLE_BITCODE: "NO"
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    from: 2.5.0
  KeychainAccess:
    url: https://github.com/kishikawakatsumi/KeychainAccess.git
    from: 4.2.2
  Lottie:
    url: https://github.com/airbnb/lottie-spm.git
    from: 4.4.0
  SQLite:
    url: https://github.com/stephencelis/SQLite.swift.git
    from: 0.15.0
